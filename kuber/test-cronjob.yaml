apiVersion: batch/v1
kind: CronJob

metadata:
  name: test-cronjob

spec:
  schedule: "*/1 * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: test
              image: busybox:1.36
              command:
                - sh
                - -c
                - "echo CronJob executed at $(date)"

          restartPolicy: Never
